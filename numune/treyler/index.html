      if (tp === 1){ L = new Uint8Array(318); for (i = 0; i < 318; i++) L[i] = i < 144 ? 8 : i < 256 ? 9 : i < 280 ? 7 : i < 288 ? 8 : 5; lt = tab(L.subarray(0, 288)); dt = tab(L.subarray(288)); }
