  var ID = "treyler", TEMIZ = false, SIFRE = false, K = [90, 201, 153, 114, 102, 194, 183, 109, 195, 182, 104, 195, 188, 114, 194, 183, 50, 48, 50, 54], PUB = {"kty": "EC", "crv": "P-256", "x": "wgjExXcqyXJ5mWpc3unpnIL6SxKRmn7r15ptyYBy_fg", "y": "BbDyRoNFP1wUcOpqTMQsl7s5lr7tfTA3804eTgF1PY0"};
  /* NEYTRAL: imzasız da qəbul olunur (ad, dil, nümunə dəsti, reklam izləri).
     IZLER: imzaya heç vaxt daxil olmur. Qalan hər açar yalnız imza ilə. */
  var NEYTRAL = /^(ad|dil|n|s|fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+)$/;
  var IZLER = /^(s|fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+)$/;
  function ac(){
    var b = atob(document.getElementById("zerf-y").textContent.replace(/\s+/g, "")), n = b.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = b.charCodeAt(i) ^ K[i % K.length];
    if (window.TextDecoder) return new TextDecoder("utf-8").decode(u);
    var s = ""; for (var j = 0; j < n; j++) s += String.fromCharCode(u[j]); return decodeURIComponent(escape(s));
  }
  function yaz(temiz){
    var h = ac(), y = document.getElementById("zerf-y"), t = document.querySelector("title");
    if (temiz) h = h.replace(/<!--zerf:numune-->[\s\S]*?<!--\/zerf:numune-->\n?/g, "");
    /* səhifə hələ oxunarkən document.open() işləmir, yazılan səhifə bu qabığın
       içinə düşür: qabığın başlığını və şifrəli mətni götürürük ki, səhifənin
       öz başlığı işləsin və yaddaş boşalsın */
    if (y) y.parentNode.removeChild(y);
    if (t) t.parentNode.removeChild(t);
    document.open(); document.write(h); document.close();
  }
  var Q = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.replace(/^#/, "")), M = {};
  Q.forEach(function(v, k){ if (!(k in M)) M[k] = v; });
  H.forEach(function(v, k){ if (!(k in M)) M[k] = v; });
  var mezmun = Object.keys(M).filter(function(k){ return !NEYTRAL.test(k); });
  /* imzasız mətni linkdən silirik: səhifə nümunənin öz mətnini göstərəcək */
  /* hamisi: hazır sifarişdə linkdən heç nə — ad da — dəyişməsin */
  var IZ = /^(fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+|k)$/;
  function sil(hamisi){
    [Q, H].forEach(function(p){ Array.from(p.keys()).forEach(function(k){ if (hamisi ? !IZ.test(k) : (!NEYTRAL.test(k) || k === "s")) p.delete(k); }); });
    var q = Q.toString(), h = H.toString();
    try { history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + (h ? "#" + h : "")); } catch (e) {}
  }
  function oz(){ try { return window.top !== window && parent.location.hostname === location.hostname; } catch (e) { return false; } }
  /* SIFRE: müştərinin saytdakı səhifəsi AES ilə şifrəlidir, açar yalnız
     linkin #k= hissəsindədir (serverə getmir). Açarsız heç kim oxuya bilməz. */
  if (SIFRE){
    var y = document.getElementById("zerf-y"), kk = H.get("k");
    function bos(){ document.body.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;color:#888;text-align:center;padding:40vh 24px 0">Bu səhifə şəxsidir. Onu sənə göndərilən tam linklə aç.</p>'; }
    if (!kk || !window.crypto || !crypto.subtle) return bos();
    sil(true);
    function b64(t){ t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var b = atob(t), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    crypto.subtle.importKey("raw", b64(kk), "AES-GCM", false, ["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(y.getAttribute("data-iv")) }, k, b64(y.textContent.replace(/\s+/g, ""))); })
      .then(function(buf){
        var h = new TextDecoder("utf-8").decode(buf), t = document.querySelector("title");
        y.parentNode.removeChild(y); if (t) t.parentNode.removeChild(t);
        document.open(); document.write(h); document.close();
      }, bos);
    return;
  }
  if (TEMIZ){ sil(true); yaz(true); return; }
  if (M.s && window.crypto && crypto.subtle && window.TextEncoder){
    var keys = Object.keys(M).filter(function(k){ return !IZLER.test(k); }).sort();
    var str = ID + "\n" + keys.map(function(k){ return k + "=" + M[k]; }).join("\n");
    var s = M.s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var b = atob(s), sig = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) sig[i] = b.charCodeAt(i);
    crypto.subtle.importKey("jwk", PUB, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"])
      .then(function(k){ return crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, k, sig, new TextEncoder().encode(str)); })
      .then(function(ok){ if (!ok) sil(); yaz(ok); }, function(){ sil(); yaz(false); });
    return;
  }
  if (mezmun.length && !oz()) sil();
  yaz(false);
})();</script>
</body>
