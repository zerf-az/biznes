    if (y.hasAttribute("data-z")) ac_z(u, function(r){ cb(oxu(r)); }); else cb(oxu(u));
  }
  function yaz(temiz){
    ac(function(h){
      var y = document.getElementById("zerf-y"), t = document.querySelector("title");
      if (temiz) h = h.replace(/<!--zerf:numune-->[\s\S]*?<!--\/zerf:numune-->\n?/g, "");

  var Q = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.replace(/^#/, "")), M = {};

  var mezmun = Object.keys(M).filter(function(k){ return !NEYTRAL.test(k); });
  /* imzasız mətni linkdən silirik: səhifə nümunənin öz mətnini göstərəcək */
  /* hamisi: hazır sifarişdə linkdən heç nə — ad da — dəyişməsin */

  function sil(hamisi){

  }
  function oz(){ try { return window.top !== window && parent.location.hostname === location.hostname; } catch (e) { return false; } }
  /* SIFRE: müştərinin saytdakı səhifəsi AES ilə şifrəlidir, açar yalnız
     linkin #k= hissəsindədir (serverə getmir). Açarsız heç kim oxuya bilməz. */
  if (SIFRE){
    var y = document.getElementById("zerf-y"), kk = H.get("k");
    function bos(){ document.body.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;color:#888;text-align:center;padding:40vh 24px 0">Bu səhifə şəxsidir. Onu sənə göndərilən tam linklə aç.</p>'; }
    if (!kk || !window.crypto || !crypto.subtle) return bos();

    function b64(t){ t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var b = atob(t), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    crypto.subtle.importKey("raw", b64(kk), "AES-GCM", false, ["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(y.getAttribute("data-iv")) }, k, b64(y.textContent.replace(/\s+/g, ""))); })
      .then(function(buf){
        function yaz2(u){
          var h = new TextDecoder("utf-8").decode(u), t = document.querySelector("title");
          y.parentNode.removeChild(y); if (t) t.parentNode.removeChild(t);

        }
        if (y.hasAttribute("data-z")) ac_z(new Uint8Array(buf), yaz2); else yaz2(new Uint8Array(buf));
      }, bos);

  }
  if (TEMIZ){ sil(true); yaz(true); return; }
  if (M.s && window.crypto && crypto.subtle && window.TextEncoder){
    var keys = Object.keys(M).filter(function(k){ return !IZLER.test(k); }).sort();
    var str = ID + "\n" + keys.map(function(k){ return k + "=" + M[k]; }).join("\n");
    var s = M.s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var b = atob(s), sig = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) sig[i] = b.charCodeAt(i);
