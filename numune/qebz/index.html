<script>(function(){
  var ID = "qebz", TEMIZ = false, SIFRE = false, K = [90, 201, 153, 114, 102, 194, 183, 109, 195, 182, 104, 195, 188, 114, 194, 183, 50, 48, 50, 54], PUB = {"kty": "EC", "crv": "P-256", "x": "wgjExXcqyXJ5mWpc3unpnIL6SxKRmn7r15ptyYBy_fg", "y": "BbDyRoNFP1wUcOpqTMQsl7s5lr7tfTA3804eTgF1PY0"};
  /* NEYTRAL: imzasız da qəbul olunur (ad, dil, nümunə dəsti, reklam izləri).
     IZLER: imzaya heç vaxt daxil olmur. Qalan hər açar yalnız imza ilə. */
  var NEYTRAL = /^(ad|dil|n|s|fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+)$/;
  var IZLER = /^(s|fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+)$/;
  function ac(){
    var b = atob(document.getElementById("zerf-y").textContent.replace(/\s+/g, "")), n = b.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = b.charCodeAt(i) ^ K[i % K.length];
    if (window.TextDecoder) return new TextDecoder("utf-8").decode(u);
    var s = ""; for (var j = 0; j < n; j++) s += String.fromCharCode(u[j]); return decodeURIComponent(escape(s));
  }
  function yaz(temiz){
    var h = ac(), y = document.getElementById("zerf-y"), t = document.querySelector("title");
    if (temiz) h = h.replace(/<!--zerf:numune-->[\s\S]*?<!--\/zerf:numune-->\n?/g, "");
    /* səhifə hələ oxunarkən document.open() işləmir, yazılan səhifə bu qabığın
       içinə düşür: qabığın başlığını və şifrəli mətni götürürük ki, səhifənin
       öz başlığı işləsin və yaddaş boşalsın */
    if (y) y.parentNode.removeChild(y);
    if (t) t.parentNode.removeChild(t);

  }
  var Q = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.replace(/^#/, "")), M = {};
  Q.forEach(function(v, k){ if (!(k in M)) M[k] = v; });
  H.forEach(function(v, k){ if (!(k in M)) M[k] = v; });
  var mezmun = Object.keys(M).filter(function(k){ return !NEYTRAL.test(k); });
  /* imzasız mətni linkdən silirik: səhifə nümunənin öz mətnini göstərəcək */
  /* hamisi: hazır sifarişdə linkdən heç nə — ad da — dəyişməsin */
  var IZ = /^(fbclid|gclid|igshid|igsh|si|ref|utm_[a-z]+|k)$/;

  if (SIFRE){
