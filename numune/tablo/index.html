      if (y) y.parentNode.removeChild(y);

  }
  var Q = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.replace(/^#/, "")), M = {};

  /* SIFRE: müştərinin saytdakı səhifəsi AES ilə şifrəlidir, açar yalnız
     linkin #k= hissəsindədir (serverə getmir). Açarsız heç kim oxuya bilməz. */
  if (SIFRE){

    crypto.subtle.importKey("raw", b64(kk), "AES-GCM", false, ["decrypt"])

      .then(function(buf){

        if (y.hasAttribute("data-z")) ac_z(new Uint8Array(buf), yaz2); else yaz2(new Uint8Array(buf));

  if (TEMIZ){ sil(true); yaz(true); return; }

    var b = atob(s), sig = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) sig[i] = b.charCodeAt(i);
